<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#181425" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="Defend your rooftop on Diwali night by slingshotting firework rockets at goofy zombies." />
  <title>Diwali Rocket Defense</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23181425'/%3E%3Crect x='7' y='3' width='2' height='6' fill='%23e43b44'/%3E%3Crect x='7' y='2' width='2' height='1' fill='%23fee761'/%3E%3Crect x='7' y='9' width='1' height='5' fill='%23b86f50'/%3E%3Crect x='3' y='4' width='1' height='1' fill='%23feae34'/%3E%3Crect x='12' y='3' width='1' height='1' fill='%232ce8f5'/%3E%3Crect x='11' y='7' width='1' height='1' fill='%23ff0044'/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; height: 100%; background: #0b0910; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    canvas#game {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #181425;
      cursor: crosshair;
    }
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 10;
      background: #181425; color: #fee761;
      font: bold 18px/1.4 monospace; text-align: center;
      align-items: center; justify-content: center; padding: 24px;
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate { display: flex; }
    }
    noscript { color: #fff; font-family: monospace; }
  </style>
</head>
<body>
  <canvas id="game" width="480" height="270" aria-label="Diwali Rocket Defense game"></canvas>
  <div id="rotate">Turn your phone sideways<br />to defend the rooftop 🎆</div>
  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
